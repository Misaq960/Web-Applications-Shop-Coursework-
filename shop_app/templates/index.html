{% extends "base.html" %}

{% block title %}Shop{% endblock %}

{% block content %}

<h1>All Items</h1>

<!-- Sorting form -->
<form method="GET" action="{{ url_for('index') }}">
    <label>Sort by:</label>

    <!-- Sort field selector -->
    <select name="sort">
        <option value="">None</option>
        <option value="name" {% if sort_field == 'name' %}selected{% endif %}>Name</option>
        <option value="price" {% if sort_field == 'price' %}selected{% endif %}>Price</option>
        <option value="impact" {% if sort_field == 'impact' %}selected{% endif %}>Environmental Impact</option>
    </select>

    <!-- Sort order selector -->
    <select name="order">
        <option value="asc" {% if sort_order == 'asc' %}selected{% endif %}>Ascending</option>
        <option value="desc" {% if sort_order == 'desc' %}selected{% endif %}>Descending</option>
    </select>

    <button type="submit" class="action-button add-button">Sort</button>
</form>

<br>

<!-- Reset sorting -->
<a href="{{ url_for('index') }}" class="action-button remove-button">Reset Sort</a>

<br><br>

<!-- Item grid -->
<div class="items">
    {% for item in stocks %}
        <div class="item-card">
            <!-- Item image -->
            <img src="{{ url_for('static', filename=item.image) }}" width="150" alt="{{ item.name }}">

            <!-- Item name + price -->
            <h3>{{ item.name }}</h3>
            <p>£{{ item.price }}</p>

            <!-- Link to item page -->
            <a href="{{ url_for('itemPage', item_id=item.id) }}" class="action-button add-button">View</a>
        </div>
    {% endfor %}
</div>

{% endblock %}
