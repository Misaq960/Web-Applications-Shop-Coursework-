<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shop - All Items</title>
</head>
<body>

<h1>Items for sale</h1>

<a href="/basket">View basket</a>

<ul>
    {% for item in stocks %}
    <li>
        <h2>{{ item.name }}</h2>
        <p>Price: £{{ item.price }}</p>
        <p>{{ item.description }}</p>

        {% if item.image %}
        <img src="{{ url_for('static', filename=item.image) }}" width="150">
        {% endif %}

        <p><a href="{{ url_for('itemPage', item_id=item.id) }}">View details</a></p>
    </li>
    {% endfor %}
</ul>

</body>
</html>
